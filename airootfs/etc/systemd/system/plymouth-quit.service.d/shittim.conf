# Shittim OS: the boot cutscene always plays to the end (shittim-splash-wait), and its last frame ("접속 승인")
# stays on screen until Hyprland draws, so no console text shows in between.
[Service]
ExecStartPre=-/usr/local/bin/shittim-splash-wait
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
