# Shittim Chest terminal. Without an explicit font kitty picked a CJK font for "monospace" and every letter
# sat in a double-wide cell. Hangul falls back to Noto Sans Mono CJK KR.
font_family      JetBrains Mono
font_size        12.5
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6

# colours: Shittim night panel (Theme.qml: ink #1E3A52, sky #2FA8E1, halo #F7C63C, momo #FF8FAB)
background            #10243A
foreground            #E6F2FA
selection_background  #2FA8E1
selection_foreground  #FFFFFF
cursor                #F7C63C
url_color             #6CC6F0
